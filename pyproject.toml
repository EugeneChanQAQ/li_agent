[project]
name = "my-harness-system"
version = "0.1.0"
description = "A personal agent harness."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=3.35.1",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
